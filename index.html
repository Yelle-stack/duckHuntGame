<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Hunt Deluxe</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="duckhunt.css">
</head>
<body>
    <div id="scenery"></div>

    <button id="play-btn">Jouer</button>
    <button id="pause-btn">Pause</button>

    <div id="message"></div>

    <!-- Barre d'information en bas de l'écran -->
    <div id="hud">
        <div class="panel" id="level-panel">
            <span id="level">NIV 1</span>
        </div>

        <div class="panel" id="hit-panel">
            <span class="label">TOUCHÉS</span>
            <div id="hit-bar">
                <span class="hit-box"></span>
                <span class="hit-box"></span>
                <span class="hit-box"></span>
                <span class="hit-box"></span>
                <span class="hit-box"></span>
                <span class="hit-box"></span>
                <span class="hit-box"></span>
                <span class="hit-box"></span>
                <span class="hit-box"></span>
                <span class="hit-box"></span>
            </div>
        </div>

        <div class="panel" id="time-panel">
            <span class="label">TEMPS</span>
            <span id="timer">200s</span>
        </div>

        <div class="panel" id="best-panel">
            <span class="label">RECORD</span>
            <span id="highscore">000000</span>
        </div>

        <div class="panel" id="score-panel">
            <span class="label">SCORE</span>
            <span id="score">000000</span>
        </div>
    </div>

    <script src="duckhunt.js"></script>
</body>
</html>
